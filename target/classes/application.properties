# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/rbpo
spring.datasource.username=${DB_USERNAME:rbpo_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# JWT
jwt.access.secret=${JWT_ACCESS_SECRET}
jwt.access.expiration=900000
jwt.refresh.secret=${JWT_REFRESH_SECRET}
jwt.refresh.expiration=604800000

server.port=8085
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat

#
signature.key-store-path=file:signing.jks
signature.key-store-type=JKS
signature.key-store-password=${SIGNING_KEYSTORE_PASSWORD}
signature.key-alias=license-signing
signature.key-password=${SIGNING_KEY_PASSWORD}
